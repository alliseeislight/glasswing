# Glasswing lock screen. The accent colour is written by the popup daemon and follows the wallpaper.
# Wallpaper, blur, card, clock, and password-field styles: Settings → Lock screen.
source = ~/.config/glass/accent.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    brightness = 0.72
    vibrancy = 0.25
    noise = 0.012
}

shape {
    monitor =
    size = 440, 380
    color = rgba(20, 22, 32, 0.40)
    rounding = 36
    border_size = 1
    border_color = rgba(255, 255, 255, 0.28)
    position = 0, 10
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 88
    font_family = Inter
    color = rgba(255, 255, 255, 0.95)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 18
    font_family = Inter
    color = rgba(255, 255, 255, 0.70)
    position = 0, 50
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 15
    font_family = Inter
    color = $accent
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $accent_soft
    inner_color = rgba(255, 255, 255, 0.10)
    font_color = rgb(255, 255, 255)
    font_family = Inter
    check_color = $accent
    fail_color = rgb(255, 95, 87)
    fade_on_empty = false
    rounding = 26
    placeholder_text = <span foreground="##ffffff99">Enter password</span>
    fail_text = <i>$FAIL</i>
    position = 0, -90
    halign = center
    valign = center
}
