<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050810"/>
      <stop offset="0.38" stop-color="#0c1326"/>
      <stop offset="0.68" stop-color="#17142b"/>
      <stop offset="1" stop-color="#2a1830"/>
    </linearGradient>
    <radialGradient id="teal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#57e6d2" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#2bb6c9" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2bb6c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b18cff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#7c5cff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb7d5" stop-opacity="0.48"/>
      <stop offset="0.55" stop-color="#f472b6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#dffcff" stop-opacity="0.28"/>
      <stop offset="0.62" stop-color="#b9c6ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur80"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="blur30"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="soft">
        <feFuncA type="linear" slope="0.055"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="soft" mode="screen"/>
    </filter>
  </defs>
  <rect width="3840" height="2160" fill="url(#bg)"/>
  <g filter="url(#blur80)">
    <ellipse cx="690" cy="1670" rx="1050" ry="760" fill="url(#teal)"/>
    <ellipse cx="2900" cy="390" rx="1180" ry="760" fill="url(#violet)"/>
    <ellipse cx="3150" cy="1760" rx="900" ry="650" fill="url(#rose)"/>
    <ellipse cx="1700" cy="960" rx="650" ry="500" fill="url(#violet)" opacity="0.55"/>
  </g>
  <g filter="url(#blur30)" opacity="0.9">
    <path d="M-260 1430 C 560 980, 1060 1510, 1780 1040 S 3060 380, 4140 760" fill="none" stroke="url(#ribbon)" stroke-width="36"/>
    <path d="M-180 1690 C 640 1250, 1180 1760, 1920 1300 S 3160 690, 4210 1040" fill="none" stroke="url(#ribbon)" stroke-width="12" opacity="0.7"/>
    <path d="M-240 1060 C 520 680, 1120 1120, 1780 720 S 3130 130, 4140 500" fill="none" stroke="url(#ribbon)" stroke-width="8" opacity="0.55"/>
  </g>
  <g filter="url(#blur8)" opacity="0.55">
    <circle cx="790" cy="1420" r="210" fill="none" stroke="#d9fbff" stroke-opacity="0.36" stroke-width="3"/>
    <circle cx="790" cy="1420" r="168" fill="none" stroke="#d9fbff" stroke-opacity="0.20" stroke-width="2"/>
    <circle cx="3020" cy="760" r="260" fill="none" stroke="#e5dcff" stroke-opacity="0.28" stroke-width="3"/>
    <circle cx="3020" cy="760" r="198" fill="none" stroke="#e5dcff" stroke-opacity="0.16" stroke-width="2"/>
  </g>
  <rect width="3840" height="2160" filter="url(#grain)" fill="none"/>
  <rect width="3840" height="2160" fill="#070a12" opacity="0.10"/>
</svg>
